name: Sprint 2 Verification

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend:
    name: Backend checks and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend_marketplace/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend_marketplace/requirements.txt

      - name: Run Django system check
        working-directory: backend_marketplace
        env:
          DJANGO_SETTINGS_MODULE: core.test_settings
          GEMINI_API_KEY: test-key-ci
        run: python manage.py check

      - name: Check pending migrations
        working-directory: backend_marketplace
        env:
          DJANGO_SETTINGS_MODULE: core.test_settings
          GEMINI_API_KEY: test-key-ci
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        working-directory: backend_marketplace
        env:
          DJANGO_SETTINGS_MODULE: core.test_settings
          GEMINI_API_KEY: test-key-ci
        run: python manage.py test --verbosity=2

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"

      - name: Install frontend dependencies
        working-directory: frontend_marketplace
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend_marketplace
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"
        run: bun run build
